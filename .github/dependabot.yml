version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router'
          - '@types/react*'
      testing:
        patterns:
          - 'vitest'
          - 'jsdom'
          - '@testing-library/*'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'globals'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
